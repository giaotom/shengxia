name: ShengXia
options:
  bundleIdPrefix: com.giaotom
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ShengXiaCore:
    path: Packages/ShengXiaCore
targets:
  ShengXia:
    type: application
    platform: iOS
    sources:
      - path: ShengXia
        excludes:
          - Info.plist
    dependencies:
      - package: ShengXiaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giaotom.shengxia
        PRODUCT_NAME: ShengXia
        INFOPLIST_FILE: ShengXia/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  ShengXia:
    build:
      targets:
        ShengXia: all
    run:
      config: Debug
    archive:
      config: Release
