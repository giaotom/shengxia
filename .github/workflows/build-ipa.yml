name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ipa:
    # macos-latest is the arm64 pool, which has been failing to assign a runner.
    # The Intel image is a separate pool and can still build an iphoneos IPA.
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test core logic
        run: swift test --package-path Packages/ShengXiaCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ShengXia.xcodeproj \
            -scheme ShengXia \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/ShengXia.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$GITHUB_WORKSPACE/build" -type d -name 'ShengXia.app' | head -n 1)"
          fi
          test -d "$APP"
          if codesign -d "$APP" >/dev/null 2>&1; then
            codesign --remove-signature "$APP" || true
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ShengXia-unsigned.ipa Payload
          unzip -l ShengXia-unsigned.ipa | head -n 40
          ls -lh ShengXia-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShengXia-unsigned-ipa
          path: ShengXia-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp ShengXia-unsigned.ipa "release/ShengXia-${VERSION}-unsigned.ipa"
          cp docs/AppIcon.png release/AppIcon.png
          (
            cd release
            shasum -a 256 "ShengXia-${VERSION}-unsigned.ipa" AppIcon.png > SHA256SUMS.txt
          )
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-body.md
          else
            printf '声匣 %s\n\n未签名安装包。安装步骤见仓库 README。\n' "$GITHUB_REF_NAME" > release-body.md
          fi
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 声匣 ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            release/ShengXia-*-unsigned.ipa
            release/AppIcon.png
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
